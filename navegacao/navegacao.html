<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegação</title>
</head>
<body>
    
    <h1>Página de navegação</h1>

    <!-------------- Navegação Externa --------------> 
    <!-- É uma navegação que leva pra uma página externa(fora da sua página)  -->

    <a href="https://www.youtube.com/?reload=9" target="_blank">
        saiba mais
    </a>

    <br>

    <!--------------- Navegação Interna -------------->
    <!-- É uma navegação, que quando o usuario clicar em algum link, ele vai levar pra mesma página -->

    <a href="./contato.html" target="_blank">
        Página de contato
    </a>

    <br>

    <a href="./sobre.html" target="_blank">
        Página Sobre
    </a>


</body>
</html>
