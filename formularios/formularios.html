<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>

    <form> <!-- Estrutura do formulário-->

        <label for="nome">Nome:</label> <!-- Serve para indicar oque o usuario tem que digitar -->
        <input type="text" name="nome" placeholder="Informe seu nome" required> <!-- Ele deixa o usuario digitar --> <!-- O placeholder, serve para mostrar uma frase, quando o usuario for escrever-->

        <label for="email">E-mail:</label>
        <input type="email" name="email" placeholder="Digite seu E-mail" required> <!-- required, o usuario é obrigatorio a responder -->

        <label for="data">Data:</label>
        <input type="date" name="data">

        <label for="senha">Senha:</label>
        <input type="password" name="senha" placeholder="Informe sua Senha">

        <label for="idade">Idade:</label>
        <input type="number" name="idade" placeholder="Informe sua idade>">

        <button type="submit">Enviar</button>

    </form>
    
</body>
</html>
