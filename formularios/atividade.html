<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
</head>
<body>
    <form>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" placeholder="Informe seu nome" required>

        <label for="sobrenome">Sobrenome:</label>
        <input type="text" name="sobrenome" placeholder="Informe seu sobrenome" required>

        <label for="idade">Idade:</label>
        <input type="number" name="idade" placeholder="Informe a sua idade" required>

        <label for="email">E-mail</label>
        <input type="email" name="email" placeholder="Digite seu E-mail" required>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" placeholder="Digite a sua Senha" required>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
